name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://orchestrator:orchestrator@localhost:5432/orchestrator
      ADMIN_TOKEN: ci-token
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: orchestrator-artifacts
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate OpenAPI contract
        run: npm run contract-openapi

      - name: Validate API route coverage
        run: npm run contract-routes

      - name: Validate event schemas
        run: npm run contract-events

      - name: Validate Prisma schema
        run: npm run contract-prisma

      - name: Run tests
        run: npm run test
