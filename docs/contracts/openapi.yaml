  /api/delegation/{id}:
    get:
      tags: [Delegation]
      summary: Get delegation status
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
          description: Delegation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationRequest"

  /api/delegation/{id}/result:
    get:
      tags: [Delegation]
