          description: Runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduledRun"
                required: [items]

components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
  parameters:
    TaskId:
      in: path
      name: id
      required: true
      schema:
        type: string
    GenericId:
      in: path
      name: id
      required: true
      schema:
        type: string
    ProjectKey:
      in: path
      name: key
      required: true
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
      required: [ok, service]
    AcceptedResponse:
      type: object
      properties:
        accepted:
          type: boolean
      required: [accepted]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error, code]

    Project:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        name:
          type: string
        description:
          type: [string, "null"]
        github_url:
          type: [string, "null"]
        github_repo:
          type: [string, "null"]
        default_branch:
          type: [string, "null"]
        workspace_path:
          type: [string, "null"]
        meta_json:
          type: [object, "null"]
          additionalProperties: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - key
        - name
        - is_active
        - created_at
        - updated_at

    ProjectCreateRequest:
      type: object
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        name:
          type: string
        description:
          type: [string, "null"]
        github_url:
          type: [string, "null"]
        github_repo:
          type: [string, "null"]
        default_branch:
          type: [string, "null"]
        workspace_path:
          type: [string, "null"]
        meta_json:
          type: [object, "null"]
          additionalProperties: true
        is_active:
          type: boolean
      required: [key, name]
      additionalProperties: false

    ProjectPatchRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: [string, "null"]
        github_url:
          type: [string, "null"]
        github_repo:
          type: [string, "null"]
        default_branch:
          type: [string, "null"]
        workspace_path:
          type: [string, "null"]
        meta_json:
          type: [object, "null"]
          additionalProperties: true
        is_active:
          type: boolean
      additionalProperties: false

    ProjectSummary:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        tasks_total:
          type: integer
          minimum: 0
        tasks_by_status:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        active_memory_entries:
          type: integer
          minimum: 0
        switch_events_recent:
          type: integer
          minimum: 0
        switch_events_window_hours:
          type: integer
          minimum: 1
        last_switch_event_at:
          type: [string, "null"]
          format: date-time
      required:
        - project
        - tasks_total
        - tasks_by_status
        - active_memory_entries
        - switch_events_recent
        - switch_events_window_hours
        - last_switch_event_at

    TaskStatus:
      type: string
      enum:
        - NEW
        - QUEUED
        - ASSIGNED
        - STARTING
        - RUNNING
        - WAITING_APPROVAL
        - WAITING_LIMIT
        - DRAINING_ACTIVE
        - SWITCHING_AUTH
        - WAITING_USER
        - INTERRUPTING
        - INTERRUPTED
        - REPLANNING
        - BLOCKED
        - FAILED_RETRYABLE
        - FAILED_TERMINAL
        - DONE
        - ARCHIVED
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          type: integer
        project_id:
          type: string
        repo_id:
          type: string
        branch:
          type: string
      required: [id, title, status]
    TaskCreateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        project_id:
          type: string
        repo_id:
          type: string
        branch:
          type: string
        priority:
          type: integer
      required: [title, description, project_id, repo_id]

    AgentTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        model:
          type: string
        auth_context_id:
          type: string
        pack_registry_entry_id:
          type: [string, "null"]
        sandbox_policy:
          type: string
        approval_policy:
          type: string
        is_enabled:
          type: boolean
      required: [id, name, role, model, is_enabled]
    AgentTemplateCreateRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        description:
          type: string
        model:
          type: string
        auth_context_id:
          type: string
        pack_registry_entry_id:
          type: [string, "null"]
        system_prompt:
          type: string
        instructions_md:
          type: string
        sandbox_policy:
          type: string
        approval_policy:
          type: string
        output_schema:
          type: object
          additionalProperties: true
      required: [name, role, model, system_prompt, sandbox_policy, approval_policy]
    AgentTemplatePatchRequest:
      type: object
      additionalProperties: true

    WorkerInstance:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        runtime_mode:
          type: string
          enum: [ondemand, warm_pool, dedicated]
        current_task_id:
          type: [string, "null"]
      required: [id, status, runtime_mode]

    AuthContext:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [apikey, chatgpt, chatgptAuthTokens]
        is_enabled:
          type: boolean
      required: [id, label, type, is_enabled]
    AuthContextCreateRequest:
      type: object
      properties:
        label:
          type: string
        type:
          type: string
        provider:
          type: string
        usage_policy:
          type: object
          additionalProperties: true
        limit_policy:
          type: object
          additionalProperties: true
      required: [label, type, provider]

    Artifact:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        type:
          type: string
          enum: [diff, patch, log, test_report, screenshot, summary, trace]
        path:
          type: string
      required: [id, task_id, type, path]

    CustomModuleConfig:
      type: object
      properties:
        id:
          type: string
        module_key:
          type: string
        is_enabled:
          type: boolean
        scope:
          type: string
          enum: [global]
        config_json:
          type: object
          additionalProperties: true
      required: [id, module_key, is_enabled, scope, config_json]
    CustomModuleConfigPatchRequest:
      type: object
      properties:
        is_enabled:
          type: boolean
        config_json:
          type: object
          additionalProperties: true

    ModuleExecution:
      type: object
      properties:
        id:
          type: string
        module_key:
          type: string
        event_type:
          type: string
        status:
          type: string
          enum: [started, completed, failed]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
      required: [id, module_key, event_type, status, started_at]

    ChatGptAuthProfile:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [active, inactive, blocked]
        checksum:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, label, status, checksum, created_at]

    RateLimitWindowSnapshot:
      type: object
      properties:
        used_percent:
          type: [integer, "null"]
        remaining_percent:
          type: [integer, "null"]
        window_minutes:
          type: [integer, "null"]
        resets_at_unix:
          type: [integer, "null"]
        resets_at_utc:
          type: [string, "null"]
          format: date-time
        reset_after_seconds:
          type: [integer, "null"]
      required:
        - used_percent
        - remaining_percent
        - window_minutes
        - resets_at_unix
        - resets_at_utc
        - reset_after_seconds

    RateLimitCreditsSnapshot:
      type: object
      properties:
        has_credits:
          type: boolean
        unlimited:
          type: boolean
        balance:
          type: [string, "null"]
      required: [has_credits, unlimited, balance]

    RateLimitSnapshot:
      type: object
      properties:
        source:
          type: string
          enum: [openai_app_server_rpc]
        captured_at:
          type: string
          format: date-time
        limit_id:
          type: [string, "null"]
        limit_name:
          type: [string, "null"]
        plan_type:
          type: [string, "null"]
        primary:
