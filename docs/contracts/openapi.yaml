openapi: 3.1.0
info:
  title: Codex Orchestrator Bus API
  version: 0.2.0
  description: Canonical MVP v1.2 API contract for codex-orchestrator.
servers:
  - url: http://localhost:8080
security:
  - AdminToken: []
tags:
  - name: Projects
  - name: Tasks
  - name: Agent Templates
  - name: Workers
  - name: Auth Contexts
  - name: Artifacts
  - name: Custom Modules
  - name: ChatGPT Auth Profiles
  - name: Queue
  - name: Packs
  - name: Memory
  - name: Agent Profiles
  - name: MCP Servers
  - name: Agent Requests
  - name: Delegation
  - name: Schedules
  - name: Health
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Dependencies are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects:
    post:
      tags: [Projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          description: Project key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Projects]
      summary: List projects
      parameters:
        - in: query
          name: include_inactive
          schema:
            type: boolean
          description: Include inactive projects in response (default true).
      responses:
        "200":
          description: Projects list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                required: [items]

  /api/projects/{key}:
    get:
      tags: [Projects]
      summary: Get project by key
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Projects]
      summary: Patch project metadata
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatchRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{key}/summary:
    get:
      tags: [Projects]
      summary: Get project summary
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - in: query
          name: switch_events_window_hours
          schema:
            type: integer
            minimum: 1
            maximum: 720
          description: Sliding window for switch-events aggregation.
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tasks:
    post:
      tags: [Tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                required: [items]

  /api/tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get task by id
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/tasks/{id}/pause:
    post:
      tags: [Tasks]
      summary: Pause task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/resume:
    post:
      tags: [Tasks]
      summary: Resume task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/stop:
    post:
      tags: [Tasks]
      summary: Stop task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/replan:
    post:
      tags: [Tasks]
      summary: Replan task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required: [reason]
      responses:
        "202":
          description: Replan accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
  /api/tasks/{id}/say:
    post:
      tags: [Tasks]
      summary: Send task steering message
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              required: [message]
      responses:
        "202":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/tasks/{id}/approve:
    post:
      tags: [Tasks]
      summary: Approve pending transition
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/reject:
    post:
      tags: [Tasks]
      summary: Reject pending transition
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/agents/templates:
    post:
      tags: [Agent Templates]
      summary: Create agent template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTemplateCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTemplate"
    get:
      tags: [Agent Templates]
      summary: List agent templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentTemplate"
                required: [items]

  /api/agents/templates/{id}:
    patch:
      tags: [Agent Templates]
      summary: Update agent template
      parameters:
        - $ref: "#/components/parameters/GenericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTemplatePatchRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTemplate"
    delete:
      tags: [Agent Templates]
      summary: Delete agent template
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "204":
          description: Deleted

  /api/workers:
    get:
      tags: [Workers]
      summary: List workers
      responses:
        "200":
          description: Workers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkerInstance"
                required: [items]

  /api/workers/{id}/restart:
    post:
      tags: [Workers]
      summary: Restart worker
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"

  /api/workers/{id}/disable:
    post:
      tags: [Workers]
      summary: Disable worker
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"

  /api/workers/{id}/logs:
    get:
      tags: [Workers]
      summary: Worker logs
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items:
                      type: string
                required: [lines]

  /api/auth-contexts:
    post:
      tags: [Auth Contexts]
      summary: Create auth context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthContextCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthContext"
    get:
      tags: [Auth Contexts]
      summary: List auth contexts
      responses:
        "200":
          description: Auth contexts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthContext"
                required: [items]

  /api/auth-contexts/{id}:
    patch:
      tags: [Auth Contexts]
      summary: Update auth context
      parameters:
        - $ref: "#/components/parameters/GenericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthContext"

  /api/auth-contexts/{id}/disable:
    post:
      tags: [Auth Contexts]
      summary: Disable auth context
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"

  /api/tasks/{id}/artifacts:
    get:
      tags: [Artifacts]
      summary: List task artifacts
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
                required: [items]

  /api/artifacts/{id}:
    get:
      tags: [Artifacts]
      summary: Get artifact
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
          description: Artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"

  /api/custom-modules:
    get:
      tags: [Custom Modules]
      summary: List custom modules
      responses:
        "200":
          description: Modules
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomModuleConfig"
                required: [items]

  /api/custom-modules/{key}:
    get:
      tags: [Custom Modules]
      summary: Get custom module config
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Module config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomModuleConfig"
    patch:
      tags: [Custom Modules]
      summary: Update module config
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomModuleConfigPatchRequest"
      responses:
        "200":
          description: Updated module config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomModuleConfig"

  /api/custom-modules/{key}/executions:
    get:
      tags: [Custom Modules]
      summary: Module execution logs
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModuleExecution"
                required: [items]

  /api/auth-profiles/chatgpt/upload:
    post:
      tags: [ChatGPT Auth Profiles]
      summary: Upload ChatGPT auth.json profile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                label:
                  type: string
                file:
                  type: string
                  format: binary
                  description: Must be file named `auth.json` with JSON object payload.
              required: [label, file]
            encoding:
              file:
                contentType: application/json
      responses:
        "201":
          description: Profile uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGptAuthProfile"

  /api/auth-profiles/chatgpt:
    get:
      tags: [ChatGPT Auth Profiles]
      summary: List profiles
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatGptAuthProfile"
                required: [items]

  /api/auth-profiles/chatgpt/{id}/activate:
    post:
      tags: [ChatGPT Auth Profiles]
      summary: Activate profile
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"

  /api/auth-profiles/chatgpt/{id}/deactivate:
    post:
      tags: [ChatGPT Auth Profiles]
      summary: Deactivate profile
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"

  /api/auth-profiles/chatgpt/{id}/limits:
    get:
      tags: [ChatGPT Auth Profiles]
      summary: Get live Codex limits for profile
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
          description: Live limits snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGptAuthProfileLimitsResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Stored profile payload is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Live limits upstream unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth-profiles/chatgpt/active:
    get:
      tags: [ChatGPT Auth Profiles]
      summary: Get active profile
      responses:
        "200":
          description: Active profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGptAuthProfile"
        "404":
          description: Active profile is not selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth-profiles/chatgpt/switch-events:
    get:
      tags: [ChatGPT Auth Profiles]
      summary: Get auth switch history (manual + automatic flows in MVP bootstrap)
      parameters:
        - in: query
          name: profile_id
          schema:
            type: string
          required: false
          description: Filter events where profile appears as source or target.
        - in: query
          name: status
          schema:
            type: string
            enum: [started, completed, failed, skipped]
          required: false
          description: Filter by switch event status.
        - in: query
          name: reason
          schema:
            type: string
          required: false
          description: Exact reason filter.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
          required: false
          description: Maximum number of events (default 200).
      responses:
        "200":
          description: Switch events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthSwitchEvent"
                required: [items]
        "400":
          description: Invalid filter query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/queue/held:
    get:
      tags: [Queue]
      summary: List held tasks
      responses:
        "200":
          description: Held tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                required: [items]
  /api/queue/held/release:
    post:
      tags: [Queue]
      summary: Release held queue
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"

  /api/packs:
    post:
      tags: [Packs]
      summary: Register role/capability pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackRegistryCreateRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PackRegistryUploadRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRegistryEntry"
    get:
      tags: [Packs]
      summary: List packs
      responses:
        "200":
          description: Packs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackRegistryEntry"
                required: [items]

  /api/packs/{id}:
    get:
      tags: [Packs]
      summary: Get pack
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
          description: Pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRegistryEntry"
    patch:
      tags: [Packs]
      summary: Update pack status or rotate pinned version
      parameters:
        - $ref: "#/components/parameters/GenericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackRegistryPatchRequest"
      responses:
        "200":
          description: Updated pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRegistryEntry"

  /api/packs/{id}/materialize:
    post:
      tags: [Packs]
      summary: Materialize pack cache for selected version
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"

  /api/memory/entries:
    post:
      tags: [Memory]
      summary: Create agent memory entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntryCreateRequest"
      responses:
        "201":
          description: Created memory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
    get:
      tags: [Memory]
      summary: List agent memory entries
      parameters:
        - in: query
          name: project_id
          schema:
            type: string
        - in: query
          name: agent_role
          schema:
            type: string
        - in: query
          name: is_active
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Memory entries list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryEntry"
                required: [items]

  /api/memory/entries/{id}:
    patch:
      tags: [Memory]
      summary: Patch agent memory entry
      parameters:
        - $ref: "#/components/parameters/GenericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntryPatchRequest"
      responses:
        "200":
          description: Updated memory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"

  /api/agent-profiles:
    post:
      tags: [Agent Profiles]
      summary: Create agent profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Agent Profiles]
      summary: List agent profiles
      parameters:
        - in: query
          name: project_id
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
        - in: query
          name: include_disabled
          schema:
            type: boolean
        - in: query
          name: role
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Agent profile list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentProfile"
                required: [items]
        "400":
          description: Invalid filter query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/agent-profiles/{id}:
    get:
      tags: [Agent Profiles]
      summary: Get agent profile by id
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "200":
