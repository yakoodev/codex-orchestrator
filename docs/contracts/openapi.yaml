        "404":
          description: Agent profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/agent-profiles/{id}/mcp-servers/{server_id}:
    post:
      tags: [Agent Profiles]
      summary: Create or update MCP server binding for profile
      parameters:
        - $ref: "#/components/parameters/GenericId"
        - in: path
          name: server_id
          required: true
