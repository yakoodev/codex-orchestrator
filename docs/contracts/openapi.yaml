  /api/agent-requests:
    post:
      tags: [Agent Requests]
      summary: Create universal agent request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequestCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRequest"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Agent Requests]
      summary: List agent requests with filters or open-pool mode
      parameters:
        - in: query
          name: project_id
          schema:
            type: string
        - in: query
          name: task_id
          schema:
            type: string
        - in: query
          name: agent_profile_id
          schema:
            type: string
        - in: query
          name: agent_template_id
          schema:
            type: string
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/AgentRequestType"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/AgentRequestStatus"
        - in: query
          name: open_pool
          schema:
            type: boolean
          description: When true, return open + blocked_agent (and optionally in_progress).
        - in: query
          name: include_in_progress
          schema:
            type: boolean
          description: Works only with open_pool=true.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Agent request list
          content:
            application/json:
              schema:
