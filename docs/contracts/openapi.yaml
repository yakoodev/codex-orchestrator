                $ref: "#/components/schemas/ScheduledRule"
    patch:
      tags: [Schedules]
      summary: Update schedule rule
      parameters:
        - $ref: "#/components/parameters/GenericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledRulePatchRequest"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledRule"
    delete:
      tags: [Schedules]
      summary: Delete schedule rule
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "204":
          description: Deleted

  /api/schedules/{id}/enable:
    post:
      tags: [Schedules]
      summary: Enable schedule rule
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"

  /api/schedules/{id}/disable:
    post:
      tags: [Schedules]
      summary: Disable schedule rule
      parameters:
        - $ref: "#/components/parameters/GenericId"
      responses:
