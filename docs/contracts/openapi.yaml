        "404":
          description: Profile or server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Orchestrator MCP invariant violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Agent Profiles]
      summary: Remove MCP server binding from profile
      parameters:
        - $ref: "#/components/parameters/GenericId"
        - in: path
          name: server_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Profile/server/binding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Orchestrator MCP cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/agent-profiles/{id}/scripts:
