        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: State conflict for terminal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/delegation/capabilities:
